<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Charts</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<script>
function loadScript(src, cb) {
  var s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  s.onerror = function() {
    // fallback to unpkg
    var s2 = document.createElement('script');
    s2.src = 'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js';
    s2.onload = cb;
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a0f;
  --s1:#0b1018;
  --s2:#111820;
  --s3:#182030;
  --border:rgba(0,200,150,0.08);
  --border2:rgba(0,200,150,0.18);
  --text:#d4e8e0;
  --muted:#3a5a4a;
  --muted2:#5a8a70;
  --accent:#00c896;
  --accent-dim:rgba(0,200,150,0.1);
  --green:#00e5a0;
  --green-bg:rgba(0,229,160,0.08);
  --red:#ff4466;
  --red-bg:rgba(255,68,102,0.08);
  --mono:'IBM Plex Mono',monospace;
  --display:'Bebas Neue',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;font-size:13px;overflow-x:hidden}

/* grid lines bg */
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,200,150,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,150,0.025) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

header{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:1.25rem;
  padding:.75rem 1.5rem;
  border-bottom:1px solid var(--border2);
  background:var(--s1);
  flex-wrap:wrap;
}
.wordmark{
  font-family:var(--display);font-size:2rem;letter-spacing:.05em;
  color:var(--accent);white-space:nowrap;line-height:1;
  text-shadow:0 0 20px rgba(0,200,150,0.4);
}
.wordmark span{color:var(--text);opacity:.5}

.search-wrap{
  flex:1;max-width:460px;
  display:flex;background:var(--s2);
  border:1px solid var(--border2);border-radius:4px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
#sym-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--mono);font-size:.85rem;
  padding:.6rem .85rem;letter-spacing:.08em;text-transform:uppercase;
}
#sym-input::placeholder{text-transform:none;letter-spacing:0;color:var(--muted2)}
#go-btn{
  background:var(--accent);border:none;color:#060a0f;
  font-family:var(--display);font-size:.95rem;letter-spacing:.08em;
  padding:0 1.1rem;cursor:pointer;transition:background .15s;
}
#go-btn:hover{background:#00e5a0}

/* exchange toggle */
.exch-toggle{display:flex;gap:.3rem;align-items:center}
.exch-btn{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;
  padding:.25rem .6rem;border-radius:3px;cursor:pointer;
  background:var(--s2);border:1px solid var(--border);color:var(--muted2);
  transition:all .15s;
}
.exch-btn.active,.exch-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* quick row */
.quick-row{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:.3rem;
  padding:.45rem 1.5rem;border-bottom:1px solid var(--border);
  background:var(--s1);overflow-x:auto;scrollbar-width:none;
}
.quick-row::-webkit-scrollbar{display:none}
.ql{color:var(--muted2);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;margin-right:.2rem}
.chip{
  font-family:var(--mono);font-size:.68rem;padding:.2rem .55rem;
  border-radius:2px;background:var(--s2);border:1px solid var(--border);
  color:var(--muted2);cursor:pointer;white-space:nowrap;transition:all .15s;letter-spacing:.04em;
}
.chip:hover,.chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* ctrl row */
.ctrl-row{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:.3rem;
  padding:.4rem 1.5rem;border-bottom:1px solid var(--border);
  background:var(--s1);flex-wrap:wrap;
}
.ctrl-label{color:var(--muted2);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;margin-right:.1rem}
.ctrl-btn{
  font-family:var(--mono);font-size:.68rem;padding:.18rem .48rem;
  border-radius:2px;background:transparent;border:1px solid var(--border);
  color:var(--muted2);cursor:pointer;transition:all .15s;
}
.ctrl-btn:hover,.ctrl-btn.active{background:var(--s3);color:var(--text);border-color:var(--border2)}
.vsep{width:1px;height:13px;background:var(--border2);margin:0 .2rem}

/* ticker bar */
#ticker-bar{
  display:none;position:relative;z-index:1;
  align-items:center;gap:.85rem;flex-wrap:wrap;
  padding:.65rem 1.5rem;border-bottom:1px solid var(--border);
  background:var(--s1);
}
.t-sym{font-family:var(--display);font-size:1.8rem;letter-spacing:.04em;color:var(--accent);line-height:1}
.t-badge{font-size:.65rem;letter-spacing:.08em;border:1px solid var(--border2);border-radius:2px;padding:.1rem .4rem;color:var(--muted2)}
.t-price{font-size:1.1rem;font-weight:500;margin-left:auto;color:var(--text)}
.t-change{font-size:.78rem;padding:.15rem .5rem;border-radius:2px}
.t-change.pos{background:var(--green-bg);color:var(--green)}
.t-change.neg{background:var(--red-bg);color:var(--red)}
.t-ohlv{font-size:.68rem;color:var(--muted2);letter-spacing:.03em}
.t-name{font-size:.72rem;color:var(--muted2)}

/* loading bar */
#loading{
  position:relative;z-index:1;
  height:2px;background:var(--s2);overflow:hidden;display:none;
}
#loading::after{
  content:'';position:absolute;left:-40%;top:0;height:100%;width:40%;
  background:var(--accent);animation:slide 1s infinite linear;
}
@keyframes slide{to{left:100%}}

/* chart */
#chart-wrap{
  position:relative;z-index:1;
  flex:1;display:none;flex-direction:column;min-height:520px;
}
#chart{flex:1;min-height:420px}
#vol-chart{height:85px;border-top:1px solid var(--border)}

/* tooltip */
#tooltip{
  position:absolute;top:12px;left:12px;
  background:var(--s2);border:1px solid var(--border2);
  border-radius:4px;padding:.5rem .75rem;
  font-size:.72rem;line-height:1.7;pointer-events:none;
  z-index:10;display:none;color:var(--text);
}
#tooltip .tt-date{color:var(--muted2);font-size:.65rem;margin-bottom:.15rem}
#tooltip .tt-o{color:var(--muted2)}
#tooltip .tt-h{color:var(--green)}
#tooltip .tt-l{color:var(--red)}
#tooltip .tt-c{font-weight:500}
#tooltip .tt-v{color:var(--muted2)}

/* placeholder */
#placeholder{
  position:relative;z-index:1;
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.6rem;min-height:500px;
}
.ph-title{font-family:var(--display);font-size:2.5rem;color:var(--accent);opacity:.15;letter-spacing:.1em}
.ph-sub{font-size:.78rem;color:var(--muted2);letter-spacing:.04em}
.ph-hint{font-size:.68rem;color:var(--muted);margin-top:.2rem}
.ph-hint code{color:var(--accent);letter-spacing:.06em}

/* toast */
#toast{
  position:fixed;bottom:1.25rem;right:1.25rem;
  background:var(--s2);border:1px solid var(--border2);border-radius:4px;
  padding:.55rem .9rem;font-size:.75rem;
  opacity:0;transform:translateY(6px);transition:all .25s;
  pointer-events:none;z-index:999;max-width:300px;
}
#toast.show{opacity:1;transform:translateY(0)}
#toast.err{border-color:var(--red);color:var(--red)}
#toast.ok{border-color:var(--accent);color:var(--accent)}
#toast.info{border-color:var(--muted2);color:var(--text)}

footer{
  position:relative;z-index:1;
  padding:.5rem 1.5rem;border-top:1px solid var(--border);
  background:var(--s1);display:flex;justify-content:space-between;
  font-size:.65rem;color:var(--muted2);
}
footer a{color:var(--muted2);text-decoration:none}
footer a:hover{color:var(--accent)}

@media(max-width:600px){
  header,.quick-row,.ctrl-row,#ticker-bar{padding-left:.85rem;padding-right:.85rem}
  .t-price{margin-left:0}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">INDIA<span>CHARTS</span></div>
  <div class="search-wrap">
    <input id="sym-input" type="text" placeholder="RELIANCE, TCS, HDFCBANK, NIFTY…" maxlength="30"/>
    <button id="go-btn">GO</button>
  </div>
  <div class="exch-toggle">
    <button class="exch-btn active" data-exch="NS">.NS &nbsp;NSE</button>
    <button class="exch-btn" data-exch="BO">.BO &nbsp;BSE</button>
  </div>
</header>

<div class="quick-row">
  <span class="ql">Popular</span>
  <button class="chip" data-s="RELIANCE">RELIANCE</button>
  <button class="chip" data-s="TCS">TCS</button>
  <button class="chip" data-s="INFY">INFY</button>
  <button class="chip" data-s="HDFCBANK">HDFCBANK</button>
  <button class="chip" data-s="ICICIBANK">ICICIBANK</button>
  <button class="chip" data-s="SBIN">SBIN</button>
  <button class="chip" data-s="WIPRO">WIPRO</button>
  <button class="chip" data-s="BAJFINANCE">BAJFINANCE</button>
  <button class="chip" data-s="TATAMOTORS">TATAMOTORS</button>
  <button class="chip" data-s="ADANIENT">ADANIENT</button>
  <button class="chip" data-s="MARUTI">MARUTI</button>
  <button class="chip" data-s="ONGC">ONGC</button>
  <span class="ql" style="margin-left:.4rem">Index</span>
  <button class="chip" data-s="^NSEI">NIFTY 50</button>
  <button class="chip" data-s="^BSESN">SENSEX</button>
  <button class="chip" data-s="^NSEBANK">BANKNIFTY</button>
</div>

<div class="ctrl-row">
  <span class="ctrl-label">Range</span>
  <button class="ctrl-btn" data-r="1d" data-i="2m">1D</button>
  <button class="ctrl-btn" data-r="5d" data-i="15m">5D</button>
  <button class="ctrl-btn" data-r="1mo" data-i="1d">1M</button>
  <button class="ctrl-btn" data-r="3mo" data-i="1d">3M</button>
  <button class="ctrl-btn" data-r="6mo" data-i="1d">6M</button>
  <button class="ctrl-btn active" data-r="1y" data-i="1d">1Y</button>
  <button class="ctrl-btn" data-r="2y" data-i="1wk">2Y</button>
  <button class="ctrl-btn" data-r="5y" data-i="1wk">5Y</button>
  <div class="vsep"></div>
  <span class="ctrl-label">Style</span>
  <button class="ctrl-btn style-btn active" data-style="candlestick">Candle</button>
  <button class="ctrl-btn style-btn" data-style="area">Area</button>
  <button class="ctrl-btn style-btn" data-style="line">Line</button>
  <div class="vsep"></div>
  <span class="ctrl-label">MA</span>
  <button class="ctrl-btn ma-btn" data-ma="20">20</button>
  <button class="ctrl-btn ma-btn" data-ma="50">50</button>
  <button class="ctrl-btn ma-btn" data-ma="200">200</button>
</div>

<div id="ticker-bar">
  <span class="t-sym" id="t-sym">—</span>
  <span class="t-badge" id="t-exch">NSE</span>
  <span class="t-name" id="t-name"></span>
  <span class="t-ohlv" id="t-ohlv"></span>
  <span class="t-price" id="t-price">—</span>
  <span class="t-change" id="t-chg">—</span>
</div>

<div id="loading"></div>

<div id="placeholder">
  <div class="ph-title">₹ NSE / BSE</div>
  <div class="ph-sub">Real-time Indian stock charts via Yahoo Finance</div>
  <div class="ph-hint">Try <code>RELIANCE</code> &nbsp;·&nbsp; <code>TCS</code> &nbsp;·&nbsp; <code>^NSEI</code></div>
</div>

<div id="chart-wrap">
  <div id="chart">
    <div id="tooltip"></div>
  </div>
  <div id="vol-chart"></div>
</div>

<div id="toast"></div>

<footer>
  <span>Data: <a href="https://finance.yahoo.com" target="_blank">Yahoo Finance</a> via CORS proxy &nbsp;·&nbsp; Charts: <a href="https://tradingview.github.io/lightweight-charts/" target="_blank">TradingView Lightweight Charts</a></span>
  <span>Informational only · Not financial advice</span>
</footer>

<script>
loadScript("https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js", function() {
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let currentSym  = '';
let currentExch = 'NS';   // NS = NSE, BO = BSE
let currentRange = '1y';
let currentInterval = '1d';
let currentStyle = 'candlestick';
let activeMA = new Set();

let chart = null, volChart = null;
let mainSeries = null, volSeries = null;
let maSeries = {};
let rawData = [];

/* CORS proxies — tried in order */
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://cors.eu.org/${url}`,
];

/* ══════════════════════════════════════════
   SYMBOL HELPERS
══════════════════════════════════════════ */
function toYahooSym(raw) {
  raw = raw.trim().toUpperCase();
  // Indices already have ^ prefix — leave them alone
  if (raw.startsWith('^')) return raw;
  // Already has .NS or .BO
  if (raw.endsWith('.NS') || raw.endsWith('.BO')) return raw;
  return raw + '.' + currentExch;
}

function displaySym(yahoo) {
  return yahoo.replace(/\.(NS|BO)$/, '').replace(/^\^/, '');
}

/* ══════════════════════════════════════════
   EXCHANGE TOGGLE
══════════════════════════════════════════ */
document.querySelectorAll('.exch-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.exch-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentExch = b.dataset.exch;
    if (currentSym) loadSymbol(displaySym(currentSym));
  };
});

/* ══════════════════════════════════════════
   QUICK CHIPS
══════════════════════════════════════════ */
document.querySelectorAll('.chip[data-s]').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    document.getElementById('sym-input').value = c.dataset.s;
    loadSymbol(c.dataset.s);
  };
});

/* ══════════════════════════════════════════
   RANGE BUTTONS
══════════════════════════════════════════ */
document.querySelectorAll('.ctrl-btn[data-r]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.ctrl-btn[data-r]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentRange = b.dataset.r;
    currentInterval = b.dataset.i;
    if (currentSym) fetchAndRender(currentSym);
  };
});

/* ══════════════════════════════════════════
   STYLE BUTTONS
══════════════════════════════════════════ */
document.querySelectorAll('.style-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentStyle = b.dataset.style;
    if (rawData.length) rebuildMainSeries();
  };
});

/* ══════════════════════════════════════════
   MA BUTTONS
══════════════════════════════════════════ */
document.querySelectorAll('.ma-btn').forEach(b => {
  b.onclick = () => {
    const ma = parseInt(b.dataset.ma);
    if (activeMA.has(ma)) {
      activeMA.delete(ma);
      b.classList.remove('active');
      if (maSeries[ma]) { chart.removeSeries(maSeries[ma]); delete maSeries[ma]; }
    } else {
      activeMA.add(ma);
      b.classList.add('active');
      if (rawData.length) drawMA(ma);
    }
  };
});

/* ══════════════════════════════════════════
   SEARCH
══════════════════════════════════════════ */
document.getElementById('go-btn').onclick = () => {
  const v = document.getElementById('sym-input').value.trim();
  if (v) loadSymbol(v);
};
document.getElementById('sym-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('go-btn').click();
});

/* ══════════════════════════════════════════
   LOAD SYMBOL
══════════════════════════════════════════ */
function loadSymbol(raw) {
  const yahoo = toYahooSym(raw);
  currentSym = yahoo;

  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('chart-wrap').style.display = 'flex';
  document.getElementById('ticker-bar').style.display = 'flex';
  document.getElementById('t-sym').textContent = displaySym(yahoo);
  document.getElementById('t-exch').textContent = yahoo.startsWith('^') ? 'INDEX' : currentExch === 'NS' ? 'NSE' : 'BSE';
  document.getElementById('t-name').textContent = '';
  document.getElementById('t-price').textContent = '…';
  document.getElementById('t-chg').textContent = '';
  document.getElementById('t-chg').className = 't-change';

  initCharts();
  fetchAndRender(yahoo);
}

/* ══════════════════════════════════════════
   FETCH WITH PROXY FALLBACK
══════════════════════════════════════════ */
async function fetchWithFallback(yahooUrl) {
  for (let i = 0; i < PROXIES.length; i++) {
    try {
      const proxyUrl = PROXIES[i](yahooUrl);
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const text = await res.text();
      const json = JSON.parse(text);
      return json;
    } catch(e) {
      if (i === PROXIES.length - 1) throw e;
    }
  }
}

/* ══════════════════════════════════════════
   FETCH & RENDER
══════════════════════════════════════════ */
async function fetchAndRender(yahoo) {
  showLoading(true);
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yahoo)}?interval=${currentInterval}&range=${currentRange}&includePrePost=false`;

  try {
    const json = await fetchWithFallback(url);
    const result = json?.chart?.result?.[0];
    if (!result) {
      toast(`No data for ${displaySym(yahoo)}. Check the symbol.`, 'err');
      showLoading(false);
      return;
    }

    const meta = result.meta;
    const timestamps = result.timestamp;
    const q = result.indicators.quote[0];

    if (!timestamps || timestamps.length === 0) {
      toast(`No price data returned for ${displaySym(yahoo)}.`, 'err');
      showLoading(false);
      return;
    }

    // Build cleaned data
    rawData = [];
    for (let i = 0; i < timestamps.length; i++) {
      if (q.close[i] == null) continue;
      rawData.push({
        time: timestamps[i],
        open:   +(q.open[i]?.toFixed(2)   ?? q.close[i].toFixed(2)),
        high:   +(q.high[i]?.toFixed(2)   ?? q.close[i].toFixed(2)),
        low:    +(q.low[i]?.toFixed(2)    ?? q.close[i].toFixed(2)),
        close:  +(q.close[i].toFixed(2)),
        volume: q.volume[i] ?? 0,
      });
    }

    if (rawData.length === 0) {
      toast(`Empty dataset for ${displaySym(yahoo)}.`, 'err');
      showLoading(false);
      return;
    }

    // Update ticker bar
    const last = rawData[rawData.length - 1];
    const prev = meta.chartPreviousClose ?? rawData[0].open;
    const change = last.close - prev;
    const pct    = (change / prev) * 100;
    const cur    = meta.currency === 'INR' ? '₹' : (meta.currency ?? '');

    document.getElementById('t-sym').textContent   = meta.symbol ? displaySym(meta.symbol) : displaySym(yahoo);
    document.getElementById('t-name').textContent  = meta.longName ?? meta.shortName ?? '';
    document.getElementById('t-price').textContent = cur + last.close.toLocaleString('en-IN');
    const sign = change >= 0 ? '+' : '';
    const chgEl = document.getElementById('t-chg');
    chgEl.textContent   = `${sign}${change.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
    chgEl.className     = 't-change ' + (change >= 0 ? 'pos' : 'neg');
    document.getElementById('t-ohlv').textContent =
      `O:${cur}${last.open.toLocaleString('en-IN')}  H:${cur}${last.high.toLocaleString('en-IN')}  L:${cur}${last.low.toLocaleString('en-IN')}  V:${formatVol(last.volume)}`;

    // Render
    setSeriesData(rawData, cur);
    activeMA.forEach(ma => drawMA(ma));
    showLoading(false);
    toast(`${rawData.length} bars loaded — ${displaySym(yahoo)}`, 'ok');

  } catch(err) {
    showLoading(false);
    toast('Fetch failed. Check your connection or try again.', 'err');
    console.error(err);
  }
}

function formatVol(v) {
  if (!v) return '—';
  if (v >= 1e7) return (v/1e7).toFixed(2) + 'Cr';
  if (v >= 1e5) return (v/1e5).toFixed(2) + 'L';
  return v.toLocaleString('en-IN');
}

/* ══════════════════════════════════════════
   INIT LIGHTWEIGHT CHARTS
══════════════════════════════════════════ */
function initCharts() {
  const chartEl = document.getElementById('chart');
  const volEl   = document.getElementById('vol-chart');
  chartEl.innerHTML = '<div id="tooltip"></div>';
  volEl.innerHTML   = '';

  // Remove old ResizeObserver if any
  if (window._chartRO) window._chartRO.disconnect();

  const baseOpts = {
    layout:{ background:{color:'#060a0f'}, textColor:'#3a5a4a' },
    grid:{ vertLines:{color:'rgba(0,200,150,0.04)'}, horzLines:{color:'rgba(0,200,150,0.04)'} },
    crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale:{ borderColor:'rgba(0,200,150,0.1)' },
    timeScale:{ borderColor:'rgba(0,200,150,0.1)', timeVisible:true, secondsVisible:false },
  };

  chart = LightweightCharts.createChart(chartEl, {
    ...baseOpts,
    width: chartEl.offsetWidth,
    height: Math.max(chartEl.offsetHeight, 420),
  });

  volChart = LightweightCharts.createChart(volEl, {
    ...baseOpts,
    width: volEl.offsetWidth,
    height: 85,
    timeScale:{ visible:false },
    rightPriceScale:{ scaleMargins:{top:0.1,bottom:0}, borderColor:'rgba(0,200,150,0.1)' },
  });

  maSeries = {};
  addMainSeries();
  volSeries = volChart.addHistogramSeries({
    priceFormat:{ type:'volume' },
  });

  // Tooltip
  chart.subscribeCrosshairMove(param => {
    const tt = document.getElementById('tooltip');
    if (!param.time || !param.seriesData || !mainSeries) { tt.style.display='none'; return; }
    const d = param.seriesData.get(mainSeries);
    if (!d) { tt.style.display='none'; return; }
    const date = new Date(param.time * 1000).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});
    const isCandle = currentStyle === 'candlestick';
    tt.style.display = 'block';
    tt.innerHTML = isCandle
      ? `<div class="tt-date">${date}</div>
         <div class="tt-o">O&nbsp; ₹${d.open?.toFixed(2)}</div>
         <div class="tt-h">H&nbsp; ₹${d.high?.toFixed(2)}</div>
         <div class="tt-l">L&nbsp; ₹${d.low?.toFixed(2)}</div>
         <div class="tt-c">C&nbsp; ₹${d.close?.toFixed(2)}</div>`
      : `<div class="tt-date">${date}</div><div class="tt-c">₹${d.value?.toFixed(2)}</div>`;
  });

  // Resize
  window._chartRO = new ResizeObserver(() => {
    chart?.applyOptions({ width: chartEl.offsetWidth });
    volChart?.applyOptions({ width: volEl.offsetWidth });
  });
  window._chartRO.observe(chartEl);
  window._chartRO.observe(volEl);
}

function addMainSeries() {
  if (currentStyle === 'candlestick') {
    mainSeries = chart.addCandlestickSeries({
      upColor:'#00e5a0', downColor:'#ff4466',
      borderUpColor:'#00e5a0', borderDownColor:'#ff4466',
      wickUpColor:'#00e5a0', wickDownColor:'#ff4466',
    });
  } else if (currentStyle === 'area') {
    mainSeries = chart.addAreaSeries({
      lineColor:'#00c896',
      topColor:'rgba(0,200,150,0.25)',
      bottomColor:'rgba(0,200,150,0)',
      lineWidth: 2,
    });
  } else {
    mainSeries = chart.addLineSeries({ color:'#00c896', lineWidth:2 });
  }
}

function setSeriesData(data, cur = '₹') {
  if (!mainSeries || !volSeries) return;

  if (currentStyle === 'candlestick') {
    mainSeries.setData(data.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
  } else {
    mainSeries.setData(data.map(d=>({time:d.time,value:d.close})));
  }

  volSeries.setData(data.map(d=>({
    time: d.time,
    value: d.volume,
    color: d.close >= d.open ? 'rgba(0,229,160,0.45)' : 'rgba(255,68,102,0.45)',
  })));

  // Price format
  mainSeries.applyOptions({
    priceFormat:{ type:'price', precision:2, minMove:0.01 },
  });

  chart.timeScale().fitContent();
  volChart.timeScale().fitContent();
}

function rebuildMainSeries() {
  if (!chart || !rawData.length) return;
  chart.removeSeries(mainSeries);
  Object.values(maSeries).forEach(s => chart.removeSeries(s));
  maSeries = {};
  addMainSeries();
  setSeriesData(rawData);
  activeMA.forEach(ma => drawMA(ma));
}

/* ══════════════════════════════════════════
   MOVING AVERAGES
══════════════════════════════════════════ */
const MA_COLORS = { 20:'#f97316', 50:'#a78bfa', 200:'#38bdf8' };

function drawMA(period) {
  if (!chart || rawData.length < period) return;
  if (maSeries[period]) { chart.removeSeries(maSeries[period]); }

  const line = chart.addLineSeries({
    color: MA_COLORS[period] ?? '#888',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Solid,
    priceLineVisible: false,
    lastValueVisible: true,
    title: `MA${period}`,
  });

  const maData = [];
  for (let i = period - 1; i < rawData.length; i++) {
    const avg = rawData.slice(i - period + 1, i + 1).reduce((s, d) => s + d.close, 0) / period;
    maData.push({ time: rawData[i].time, value: +avg.toFixed(2) });
  }
  line.setData(maData);
  maSeries[period] = line;
}

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function showLoading(on) {
  document.getElementById('loading').style.display = on ? 'block' : 'none';
}

let toastTimer;
function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3800);
}
});
</script>
