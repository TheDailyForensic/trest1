<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ytdl — YouTube Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #222;
      --text: #e8e8e8;
      --muted: #555;
      --accent: #c8f557;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.2rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }

    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .iframe-wrap {
      width: 100%;
      max-width: 860px;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
    }

    iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
</head>
<body>

  <header>
    <h1>ytdl.</h1>
    <p>paste a link · pick a format · get the file</p>
  </header>

  <main>
    <p class="subtitle">supports youtube, instagram, twitter/x, tiktok and more</p>
    <div class="iframe-wrap">
      <iframe
        src="https://embed.dlsrv.online/v1/full?videoId="
        allowfullscreen
      ></iframe>
    </div>
  </main>

  <footer>
    ytdl — free, no signup, no bs
  </footer>

</body>
</html>
