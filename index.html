<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #f0f0f5;
    --muted: #666680;
    --accent: #7c6af7;
    --accent-dim: rgba(124,106,247,0.15);
    --accent-glow: rgba(124,106,247,0.3);
    --green: #22c55e;
    --red: #ef4444;
    --mono: 'DM Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .logo {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    color: var(--text);
    flex-shrink: 0;
  }

  .logo span {
    color: var(--accent);
  }

  .search-bar {
    flex: 1;
    max-width: 540px;
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .search-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.9rem;
    padding: 0.65rem 1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .search-bar input::placeholder {
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
  }

  .search-bar button {
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.8rem;
    padding: 0 1.25rem;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.15s;
  }

  .search-bar button:hover { background: #9180f9; }
  .search-bar button:active { background: #6354d6; }

  .quick-picks {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    align-items: center;
    padding: 0.75rem 2rem;
    border-bottom: 1px solid var(--border);
  }

  .quick-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 0.25rem;
  }

  .chip {
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 0.25rem 0.65rem;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }

  .chip:hover {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .chip.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .settings-bar {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    padding: 0.6rem 2rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .settings-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 0.1rem;
  }

  .interval-btn {
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 0.2rem 0.55rem;
    border-radius: 4px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .interval-btn:hover {
    background: var(--surface2);
    color: var(--text);
    border-color: var(--border-hover);
  }

  .interval-btn.active {
    background: var(--surface2);
    color: var(--text);
    border-color: var(--border-hover);
  }

  .sep { width: 1px; height: 16px; background: var(--border); margin: 0 0.25rem; }

  .theme-toggle {
    margin-left: auto;
    display: flex;
    gap: 0.4rem;
  }

  .theme-btn {
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .theme-btn.active {
    background: var(--surface2);
    color: var(--text);
    border-color: var(--border-hover);
  }

  .ticker-info {
    padding: 1rem 2rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .ticker-symbol {
    font-family: var(--display);
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .ticker-name {
    font-size: 0.8rem;
    color: var(--muted);
  }

  #widget-container {
    flex: 1;
    min-height: 560px;
  }

  #widget-container iframe {
    width: 100%;
    height: 100%;
    min-height: 560px;
    border: none;
    display: block;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 560px;
    gap: 1rem;
    color: var(--muted);
  }

  .placeholder-icon {
    font-size: 3rem;
    opacity: 0.2;
  }

  .placeholder p {
    font-size: 0.85rem;
    letter-spacing: 0.04em;
  }

  footer {
    padding: 0.75rem 2rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted);
  }

  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }

  @media (max-width: 600px) {
    header, .quick-picks, .settings-bar, .ticker-info { padding-left: 1rem; padding-right: 1rem; }
    .ticker-symbol { font-size: 1.2rem; }
    .theme-toggle { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">chart<span>.</span>view</div>
  <div class="search-bar">
    <input type="text" id="ticker-input" placeholder="Enter ticker symbol... AAPL, TSLA, BTC..." maxlength="20" />
    <button onclick="loadTicker()">GO</button>
  </div>
</header>

<div class="quick-picks">
  <span class="quick-label">Popular</span>
  <button class="chip" onclick="setTicker('AAPL')">AAPL</button>
  <button class="chip" onclick="setTicker('TSLA')">TSLA</button>
  <button class="chip" onclick="setTicker('MSFT')">MSFT</button>
  <button class="chip" onclick="setTicker('GOOGL')">GOOGL</button>
  <button class="chip" onclick="setTicker('AMZN')">AMZN</button>
  <button class="chip" onclick="setTicker('NVDA')">NVDA</button>
  <button class="chip" onclick="setTicker('META')">META</button>
  <button class="chip" onclick="setTicker('BINANCE:BTCUSDT')">BTC</button>
  <button class="chip" onclick="setTicker('BINANCE:ETHUSDT')">ETH</button>
  <button class="chip" onclick="setTicker('SPY')">SPY</button>
</div>

<div class="settings-bar">
  <span class="settings-label">Interval</span>
  <button class="interval-btn" onclick="setInterval('1')">1m</button>
  <button class="interval-btn" onclick="setInterval('5')">5m</button>
  <button class="interval-btn" onclick="setInterval('15')">15m</button>
  <button class="interval-btn" onclick="setInterval('60')">1H</button>
  <button class="interval-btn" onclick="setInterval('D')">1D</button>
  <button class="interval-btn active" onclick="setInterval('W')">1W</button>
  <button class="interval-btn" onclick="setInterval('M')">1M</button>
  <div class="sep"></div>
  <span class="settings-label">Style</span>
  <button class="interval-btn" onclick="setStyle('1')">Candle</button>
  <button class="interval-btn active" onclick="setStyle('3')">Area</button>
  <button class="interval-btn" onclick="setStyle('0')">Bar</button>
  <button class="interval-btn" onclick="setStyle('2')">Line</button>
  <div class="sep"></div>
  <div class="theme-toggle">
    <span class="settings-label">Theme</span>
    <button class="theme-btn active" onclick="setTheme('dark')">Dark</button>
    <button class="theme-btn" onclick="setTheme('light')">Light</button>
  </div>
</div>

<div class="ticker-info" id="ticker-info" style="display:none;">
  <span class="ticker-symbol" id="display-symbol">AAPL</span>
  <span class="ticker-name" id="display-name">Powered by TradingView</span>
</div>

<div id="widget-container">
  <div class="placeholder">
    <div class="placeholder-icon">📈</div>
    <p>Enter a ticker symbol above to load a chart</p>
  </div>
</div>

<footer>
  <span>Data provided by <a href="https://www.tradingview.com" target="_blank">TradingView</a></span>
  <span>For informational purposes only · Not financial advice</span>
</footer>

<script>
  let currentSymbol = '';
  let currentInterval = 'W';
  let currentStyle = '3';
  let currentTheme = 'dark';

  function setTicker(symbol) {
    document.getElementById('ticker-input').value = symbol;
    loadTicker();
  }

  function loadTicker() {
    const raw = document.getElementById('ticker-input').value.trim().toUpperCase();
    if (!raw) return;
    currentSymbol = raw;

    document.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', c.textContent === raw || c.getAttribute('onclick') === `setTicker('${raw}')`);
    });

    const infoEl = document.getElementById('ticker-info');
    infoEl.style.display = 'flex';
    document.getElementById('display-symbol').textContent = raw;
    document.getElementById('display-name').textContent = 'Powered by TradingView';

    renderWidget();
  }

  function setInterval(interval) {
    currentInterval = interval;
    document.querySelectorAll('.interval-btn').forEach((b, i, arr) => {
      const labels = ['1m','5m','15m','1H','1D','1W','1M'];
      const intervals = ['1','5','15','60','D','W','M'];
      if (intervals.includes(b.getAttribute('onclick')?.match(/'(.+)'/)?.[1])) {
        b.classList.toggle('active', b.getAttribute('onclick').includes(`'${interval}'`));
      }
    });
    if (currentSymbol) renderWidget();
  }

  function setStyle(style) {
    currentStyle = style;
    document.querySelectorAll('.interval-btn').forEach(b => {
      const match = b.getAttribute('onclick')?.match(/setStyle\('(.+)'\)/);
      if (match) b.classList.toggle('active', match[1] === style);
    });
    if (currentSymbol) renderWidget();
  }

  function setTheme(theme) {
    currentTheme = theme;
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.getAttribute('onclick').includes(theme));
    });
    if (currentSymbol) renderWidget();
  }

  function renderWidget() {
    const container = document.getElementById('widget-container');
    container.innerHTML = '';

    const widgetConfig = {
      autosize: true,
      symbol: currentSymbol,
      interval: currentInterval,
      timezone: "Etc/UTC",
      theme: currentTheme,
      style: currentStyle,
      locale: "en",
      toolbar_bg: currentTheme === 'dark' ? "#111118" : "#f8f9fa",
      enable_publishing: false,
      allow_symbol_change: true,
      save_image: true,
      calendar: true,
      hide_side_toolbar: false,
      withdateranges: true,
      studies: ["Volume@tv-basicstudies"]
    };

    const script = document.createElement('script');
    script.src = 'https://s3.tradingview.com/tv.js';
    script.onload = function() {
      new TradingView.widget({
        ...widgetConfig,
        container_id: "widget-container"
      });
    };

    if (window.TradingView) {
      new TradingView.widget({
        ...widgetConfig,
        container_id: "widget-container"
      });
    } else {
      document.body.appendChild(script);
    }
  }

  document.getElementById('ticker-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loadTicker();
  });

  setTimeout(() => setTicker('AAPL'), 300);
</script>

</body>
</html>
